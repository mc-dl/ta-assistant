  G1 --&gt;|&quot;是&quot;| W[&quot;写 FAQ&lt;br/&gt;不经过分类器&quot;]
  G1 --&gt;|&quot;不是&quot;| G2{&quot;②学生转发闸门&lt;br/&gt;以 【转发学生提问】 开头?&quot;}
  G2 --&gt;|&quot;是&quot;| C[&quot;进分类器&lt;br/&gt;submission / question&quot;]
  G2 --&gt;|&quot;不是&quot;| S[&quot;skip&lt;br/&gt;(非学生消息,未处理)&quot;]</desc>
